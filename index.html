<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CS 180 project directory for Theo Dela Cruz">
    <title>CS 180 Projects | Theo Dela Cruz</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1e1f22;
        --muted: #666b73;
        --line: #dfe1e5;
        --paper: #fbfbfa;
        --accent: #b9975b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.55;
      }

      main { max-width: 880px; margin: 0 auto; padding: 64px 24px 88px; }
      header { padding-bottom: 34px; border-bottom: 1px solid var(--line); }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .11em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2.35rem, 6vw, 4.5rem);
        font-weight: 500;
        line-height: 1.12;
      }

      .intro { max-width: 570px; margin: 20px 0 0; color: var(--muted); }

      nav { margin-top: 40px; }
      ol { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }

      li { border-bottom: 1px solid var(--line); }

      .project {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 4px;
        color: var(--ink);
        text-decoration: none;
      }

      a.project:hover, a.project:focus-visible { color: var(--accent); }
      .number { color: var(--muted); font-size: .9rem; }
      .name { flex: 1; font-family: Georgia, 'Times New Roman', serif; font-size: 1.35rem; }
      .status { color: var(--muted); font-size: .9rem; }
      a.project .status::after { content: ' →'; }

      footer { margin-top: 56px; color: var(--muted); font-size: .9rem; }

      @media (max-width: 500px) {
        main { padding-top: 40px; }
        .project { gap: 12px; padding: 18px 2px; }
        .name { font-size: 1.15rem; }
        .status { font-size: .82rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">CS 180 / 280A</p>
        <h1>Project Directory</h1>
        <p class="intro">Theo Dela Cruz's work for CS 180.</p>
      </header>

      <nav aria-label="CS 180 projects">
        <ol>
          <li>
            <a class="project" href="project0.html">
              <span class="number">Project 0</span>
              <span class="name">Becoming Friends with Your Camera</span>
              <span class="status">View project</span>
            </a>
          </li>
          <li><div class="project"><span class="number">Project 1</span><span class="name">Coming soon</span></div></li>
          <li><div class="project"><span class="number">Project 2</span><span class="name">Coming soon</span></div></li>
          <li><div class="project"><span class="number">Project 3</span><span class="name">Coming soon</span></div></li>
          <li><div class="project"><span class="number">Project 4</span><span class="name">Coming soon</span></div></li>
          <li><div class="project"><span class="number">Project 5</span><span class="name">Coming soon</span></div></li>
        </ol>
      </nav>

      <footer>CS 180 / 280A</footer>
    </main>
  </body>
</html>
